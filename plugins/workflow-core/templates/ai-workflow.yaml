# SpecLock project workflow configuration (commit to git at repository root)
# Recommended: run /workflow-core:init to auto-detect and generate; or copy and fill in manually.
#
# Format: restricted YAML subset parsed directly without PyYAML
#   - "key: value" mappings; when value is empty, indent child keys 2 spaces on the next line
#   - String lists use one "- value" per line; inline [a, b] and {a: b} are not supported
#   - Multiline strings (| >), anchors (& *), multi-document (---), and tabs are not supported
#   - Use "TBD" for unconfirmed values and "none" for not applicable; do not leave example placeholders
# Store only facts scripts and skills consume directly (paths, commands, enums, names); put rules in project docs/.
# Validate after editing: python3 <workflow-core>/scripts/check_docs.py --root . --check-config

version: 1

# Workflow gates are always enabled; engine.enabled is no longer supported.
# Plugin gates guard supported tool paths and state transitions, not a tamper-proof security sandbox.
baseline:
  required:                                # Required project baselines read before implementation (lean mode: docs/development/standards.md)
    - docs/development/architecture.md
    - docs/development/coding.md
  # Optional path-scoped baselines: "<glob> => <relative doc path>".
  # Example: src/**/*.py => docs/development/python.md; remove rules that do not apply.

docs:
  product_root: docs/product
  home: docs/product/index.md
  requirements: docs/product/requirements/prd.md
  cards_dir: docs/product/tasks
  overview: docs/product/tasks/overview.md
  design_index: docs/product/design/index.md
  dev_docs: docs/development
  glossary: docs/product/glossary.md        # Project glossary; write "none" if unused

handoff:
  default: docs/development/handoffs/{task_id}.md

review:
  base_branch: main                        # Target branch for feature merges (e.g. main or develop)

verify:
  docs: <doc check command, recommended self-contained: python3 scripts/check_docs.py --root .>
  light: <targeted tests + static analysis command>
  standard: <full test suite + static analysis command>
  full:                                    # Commands run sequentially
    - <full test suite + static analysis command>
    - <default platform build command>

design:
  tool: figma                              # figma | pixso | none
  source_doc: docs/development/ui.md       # Document identifying the authoritative design source

api:
  tool: apifox                             # apifox | none
  project: <API platform project name>
  project_id_file: .apifox/settings.json

# Legacy code_rules_doc is still readable and deduplicated; new projects use baseline.

notes:                                     # Short project-specific conventions only
  - <convention>
