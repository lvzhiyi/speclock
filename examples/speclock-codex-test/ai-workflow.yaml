version: 1
baseline:
  required:
    - docs/development/standards.md
docs:
  product_root: docs/product
  cards_dir: docs/product/tasks
  dev_docs: docs/development
review:
  base_branch: main
verify:
  docs: python3 scripts/check_docs.py --check-config
  light: python3 -m unittest discover -s src
  standard:
    - python3 -m unittest discover -s src
    - python3 scripts/check_docs.py --check-config
  full:
    - python3 -m unittest discover -s src
    - python3 scripts/check_docs.py --check-config
